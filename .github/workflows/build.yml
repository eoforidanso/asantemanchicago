name: Build site

# When something under src/ changes (including a Save from the admin page), rebuild the
# pages with build.py, commit the result and ask GitHub Pages to publish it.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.py'
      - 'assets/img/gallery/uploads/**'
      - 'assets/img/people/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python build.py
      - name: Commit the rebuilt pages
        run: |
          git config user.name "AACM site builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build: refresh generated pages"
            git push
          fi
      - name: Ask GitHub Pages to publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
